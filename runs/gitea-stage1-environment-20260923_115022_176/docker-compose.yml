services:
  postgres:
    image: postgres:16-alpine
    container_name: gitea-stage1-db
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_STAGE1_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 2s
      timeout: 3s
      retries: 45
    volumes:
      - gitea_stage1_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  gitea:
    image: docker.gitea.com/gitea:1.27.3
    container_name: gitea-stage1-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_STAGE1_POSTGRES_PASSWORD}
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://127.0.0.1:3477/
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "127.0.0.1:3477:3000"
    volumes:
      - gitea_stage1_data:/data
    restart: unless-stopped

volumes:
  gitea_stage1_postgres_data:
  gitea_stage1_data:
