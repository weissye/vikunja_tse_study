services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: local-research-only
      POSTGRES_DB: mealie
      PGUSER: mealie
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 5s
      timeout: 3s
      retries: 24
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.27.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9927:9000"
    environment:
      DB_ENGINE: postgres
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mealie
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: local-research-only
      ALLOW_SIGNUP: "false"
      BASE_URL: http://127.0.0.1:9927
      DEFAULT_EMAIL: changeme@example.com
      DEFAULT_GROUP: Research
      DEFAULT_HOUSEHOLD: Research
    volumes:
      - appdata:/app/data/
volumes:
  pgdata:
  appdata:
